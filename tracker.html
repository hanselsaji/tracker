
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gun-woo">
<meta name="theme-color" content="#080808">
<title>Gun-woo Protocol</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#e2e2e2;font-family:'Courier New',monospace;overscroll-behavior:none}
input{-webkit-appearance:none;-moz-appearance:none}
input[type=time]{color-scheme:dark}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
button:active{opacity:0.7}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ── CONSTANTS ─────────────────────────────────────────────────────
const START="2026-05-08",SW_KG=63,TGT_KG=78;
const WK_SCHED=["A","BOXING","B","BOXING","C","D","REST"];

const WO={
  A:{name:"Back & Biceps",tag:"PULL",col:"#ef4444",ex:[
    {k:"a1",n:"Pull-ups",s:5,r:"Max reps",note:"Dead hang · full ROM · your main weapon"},
    {k:"a2",n:"DB Rows",s:4,r:"10 each arm",note:"12.5kg · elbow to hip · no momentum"},
    {k:"a3",n:"DB Curls",s:3,r:"12",note:"7.5kg · controlled · no swing"},
    {k:"a4",n:"Rear Delt Fly",s:3,r:"15",note:"5kg · squeeze at top"},
    {k:"a5",n:"Dead Hangs",s:3,r:"30 sec",note:"Grip strength + shoulder health"},
  ]},
  B:{name:"Chest & Shoulders",tag:"PUSH",col:"#f97316",ex:[
    {k:"b1",n:"Pike Push-ups",s:4,r:"Max reps",note:"Progress toward handstand push-up"},
    {k:"b2",n:"DB Shoulder Press",s:4,r:"10",note:"10kg each · V-taper builder"},
    {k:"b3",n:"Lateral Raises",s:4,r:"15",note:"5kg each · slow and controlled"},
    {k:"b4",n:"Floor DB Press",s:4,r:"10",note:"12.5kg each · chest squeeze at top"},
    {k:"b5",n:"Chair Dips",s:3,r:"Max reps",note:"Between two sturdy chairs"},
  ]},
  C:{name:"Legs",tag:"LEGS",col:"#eab308",ex:[
    {k:"c1",n:"Goblet Squats",s:4,r:"12",note:"Heaviest dumbbell · full depth"},
    {k:"c2",n:"Romanian Deadlifts",s:4,r:"10",note:"Both DBs · feel the hamstring stretch"},
    {k:"c3",n:"Lunges",s:3,r:"12 each leg",note:"Walking lunges with dumbbells"},
    {k:"c4",n:"Calf Raises",s:5,r:"25",note:"Step edge if possible · slow tempo"},
    {k:"c5",n:"Jump Squats",s:3,r:"10",note:"Explosive · land soft"},
  ]},
  D:{name:"Full Body",tag:"EXPLOSIVE",col:"#8b5cf6",ex:[
    {k:"d1",n:"Pull-up Max Set",s:1,r:"All-out max",note:"Beat last week's count"},
    {k:"d2",n:"Push-up Max Set",s:1,r:"All-out max",note:"Perfect form throughout"},
    {k:"d3",n:"Squat Jumps",s:3,r:"10",note:"Max height · land soft"},
    {k:"d4",n:"DB Squat to Press",s:4,r:"8",note:"7.5kg each · squat down + overhead press"},
    {k:"d5",n:"Core Circuit",s:3,r:"5 min",note:"20 crunches + 10 leg raises + 30s plank"},
  ]},
  BOXING:{name:"Boxing",tag:"SKILL",col:"#06b6d4",ex:[
    {k:"bx1",n:"Jump Rope / High Knees",s:1,r:"3 min",note:"Warm-up · get the rhythm"},
    {k:"bx2",n:"Footwork Drills",s:1,r:"5 min",note:"Forward · back · lateral in stance"},
    {k:"bx3",n:"Shadowboxing Rounds",s:4,r:"2 min each",note:"Jab + Cross · 1 min rest between"},
    {k:"bx4",n:"Core Finisher",s:3,r:"10 min total",note:"Crunches + leg raises + plank"},
  ]},
  REST:{name:"Rest Day",tag:"RECOVERY",col:"#4b5563",ex:[]},
};

const MEALS=[
  {id:1,time:"7:00 AM",name:"Morning Fuel",e:"🌅",cal:780,pro:28,items:["2 bananas","3 boiled eggs","Oats in full-fat milk","1 tbsp peanut butter"]},
  {id:2,time:"12:30 PM",name:"Lunch",e:"🍚",cal:1040,pro:32,items:["3 cups rice","Dal or sambar","2 eggs or curd","Veg curry + chutney"]},
  {id:3,time:"4:00 PM",name:"Pre-Workout",e:"⚡",cal:390,pro:10,items:["1 banana","1 tbsp peanut butter","2-3 dates","1 glass full-fat milk"]},
  {id:4,time:"7:30 PM",name:"Dinner",e:"🍽️",cal:845,pro:28,items:["3 cups rice or 2 chapathi","Egg curry or green gram","Thoran","1 tsp ghee"]},
  {id:5,time:"9:30 PM",name:"Before Bed",e:"🌙",cal:380,pro:18,items:["1 glass full-fat milk","2 boiled eggs","1 banana"]},
];
const BASE_CAL=3435,BASE_PRO=116;

const SW_PILLARS=[
  {id:"body",label:"BODY",side:"WAYNE",col:"#ef4444",icon:"⚔️",tasks:[
    {k:"trained",l:"Train 45+ mins",s:"Dumbbells + pull-up bar — no shortcuts"},
    {k:"protein",l:"Hit protein target",s:"116g+ protein — no protein, no growth"},
    {k:"noJunk",l:"Zero junk food",s:"One cheat = day reset. No exceptions"},
  ]},
  {id:"mind",label:"MIND",side:"STARK",col:"#f59e0b",icon:"🧠",tasks:[
    {k:"read10",l:"Read 10 pages",s:"Non-fiction — strategy, psychology, technical"},
    {k:"noScrollAM",l:"No scroll before 10am",s:"First hour belongs to you, not the feed"},
  ]},
  {id:"craft",label:"CRAFT",side:"STARK",col:"#3b82f6",icon:"⚙️",tasks:[
    {k:"skillWork",l:"1hr deliberate skill work",s:"TryHackMe / lab / code — no tutorials"},
    {k:"documented",l:"Document something",s:"Writeup, note, or commit — proof you built"},
  ]},
  {id:"identity",label:"IDENTITY",side:"WAYNE",col:"#8b5cf6",icon:"🧊",tasks:[
    {k:"coldShower",l:"Cold shower",s:"Train the override muscle — every single day"},
  ]},
];
const SW_KEYS=SW_PILLARS.flatMap(p=>p.tasks.map(t=>t.k));

// ── STORAGE ──────────────────────────────────────────────────────
const ls={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};

// ── HELPERS ──────────────────────────────────────────────────────
const todayStr=()=>new Date().toISOString().split("T")[0];
const getDOW=s=>(new Date(s+"T12:00:00").getDay()+6)%7;
const getDN=s=>Math.floor((new Date(s+"T00:00:00")-new Date(START+"T00:00:00"))/86400000)+1;
const getPhase=n=>n<=61?{n:1,name:"Foundation",col:"#ef4444"}:n<=152?{n:2,name:"Build",col:"#f97316"}:{n:3,name:"Sharpen",col:"#eab308"};
const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const prevDay=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-1);return d.toISOString().split("T")[0]};
const emptyLog=()=>({meals:[false,false,false,false,false],wDone:false,water:0,sleepAt:"",wakeAt:"",weight:"",football:false,sets:{},note:""});
const emptySW=()=>Object.fromEntries(SW_KEYS.map(k=>[k,false]));
const emptyMeta=()=>({streak:0,longest:0,lastDate:null,fails:Object.fromEntries(SW_KEYS.map(k=>[k,0]))});

// ── COMPONENTS ───────────────────────────────────────────────────
function Ring({pct,size=148}){
  const r=size*.38,c=2*Math.PI*r,off=c*(1-Math.min(100,pct)/100);
  const col=pct>=100?"#22c55e":pct>=60?"#f59e0b":pct>=30?"#f97316":"#ef4444";
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{filter:`drop-shadow(0 0 10px ${col}45)`}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1c1c1c" strokeWidth="9"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="9"
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset 0.7s ease"}}/>
      <text x={size/2} y={size/2-7} textAnchor="middle" fill="#fff" fontSize={size*.21} fontWeight="700" fontFamily="monospace">{Math.round(pct)}%</text>
      <text x={size/2} y={size/2+12} textAnchor="middle" fill="#555" fontSize={size*.072} fontFamily="monospace" letterSpacing="1.5">EXECUTION</text>
    </svg>
  );
}

function WtChart({weights}){
  if(!weights||!weights.length)return<div style={{textAlign:"center",padding:"28px 0",fontSize:"0.58rem",color:"#333"}}>Log your weight daily to see the curve build</div>;
  const W=310,H=130,PX=26,PY=14,mn=59,mx=80;
  const all=[{date:START,weight:SW_KG},...weights];
  const tx=(i,tot)=>PX+(i/Math.max(tot-1,1))*(W-PX*2);
  const ty=w=>H-PY-((w-mn)/(mx-mn))*(H-PY*2);
  const pts=all.map((p,i)=>`${tx(i,all.length)},${ty(p.weight)}`).join(" ");
  const area=`M${tx(0,all.length)},${H-PY} `+all.map((p,i)=>`L${tx(i,all.length)},${ty(p.weight)}`).join(" ")+` L${tx(all.length-1,all.length)},${H-PY} Z`;
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="5%" stopColor="#ef4444" stopOpacity=".35"/><stop offset="95%" stopColor="#ef4444" stopOpacity="0"/>
      </linearGradient></defs>
      {[62,66,70,74,78].map(w=>(
        <g key={w}><line x1={PX} y1={ty(w)} x2={W-PX} y2={ty(w)} stroke="#1a1a1a" strokeWidth="1"/>
        <text x="2" y={ty(w)+3} fill="#3a3a3a" fontSize="7" fontFamily="monospace">{w}</text></g>
      ))}
      <line x1={PX} y1={ty(TGT_KG)} x2={W-PX} y2={ty(TGT_KG)} stroke="#ef444440" strokeDasharray="4 3" strokeWidth="1.5"/>
      <text x={W-PX+3} y={ty(TGT_KG)+3} fill="#ef4444" fontSize="7" fontFamily="monospace">78</text>
      <path d={area} fill="url(#ag)"/>
      <polyline points={pts} fill="none" stroke="#ef4444" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {all.map((p,i)=><circle key={i} cx={tx(i,all.length)} cy={ty(p.weight)} r={i===0?2:3} fill={i===0?"#555":"#ef4444"} stroke="#080808" strokeWidth="1.5"/>)}
    </svg>
  );
}

function Heatmap({scores}){
  const cells=Array.from({length:35},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(34-i));return d.toISOString().split("T")[0]});
  const col=v=>{if(v===undefined||v<0)return"#141414";if(v===0)return"#1c1c1c";if(v<=2)return"#7f1d1d";if(v<=4)return"#b45309";if(v<=6)return"#d97706";if(v<=7)return"#eab308";return"#22c55e"};
  return(
    <div>
      <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
        {cells.map(d=><div key={d} title={`${d.slice(5)}: ${scores[d]??0}/8`} style={{width:14,height:14,borderRadius:3,background:col(scores[d])}}/>)}
      </div>
      <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center",flexWrap:"wrap"}}>
        {["0","1-2","3-4","5-6","7","8/8"].map((l,i)=>(
          <div key={i} style={{display:"flex",gap:3,alignItems:"center"}}>
            <div style={{width:9,height:9,borderRadius:2,background:["#1c1c1c","#7f1d1d","#b45309","#d97706","#eab308","#22c55e"][i]}}/>
            <span style={{fontSize:"0.45rem",color:"#444"}}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function RestTimer(){
  const [t,setT]=useState(0);
  const [on,setOn]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(on&&t>0){ref.current=setInterval(()=>setT(p=>{if(p<=1){setOn(false);return 0;}return p-1;}),1000);}
    return()=>clearInterval(ref.current);
  },[on]);
  const go=s=>{clearInterval(ref.current);setT(s);setOn(true)};
  const r=18,c=2*Math.PI*r,init=on?(t<=60?60:90):90,off=c*(1-t/init);
  return(
    <div style={{display:"flex",alignItems:"center",gap:10,background:"#0a0a0a",border:"1px solid #1c1c1c",borderRadius:8,padding:"9px 13px",margin:"8px 0",animation:on?"none":"none"}}>
      <span style={{fontSize:"0.5rem",color:"#555",letterSpacing:"0.15em",flexShrink:0}}>REST TIMER</span>
      {on?(
        <>
          <svg width={r*2+8} height={r*2+8} style={{flexShrink:0}}>
            <circle cx={r+4} cy={r+4} r={r} fill="none" stroke="#1c1c1c" strokeWidth="3"/>
            <circle cx={r+4} cy={r+4} r={r} fill="none" stroke={t>20?"#22c55e":"#ef4444"} strokeWidth="3"
              strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
              transform={`rotate(-90 ${r+4} ${r+4})`} style={{transition:"stroke-dashoffset 1s linear"}}/>
            <text x={r+4} y={r+8} textAnchor="middle" fill="#fff" fontSize="11" fontFamily="monospace">{t}</text>
          </svg>
          <span style={{fontSize:"0.6rem",color:t>20?"#22c55e":"#ef4444",fontWeight:700}}>{t}s</span>
          <button onClick={()=>{setOn(false);setT(0);clearInterval(ref.current)}} style={{marginLeft:"auto",background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:5,color:"#666",padding:"5px 10px",cursor:"pointer",fontSize:"0.5rem",fontFamily:"monospace"}}>STOP</button>
        </>
      ):(
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          {[60,90].map(s=><button key={s} onClick={()=>go(s)} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:5,color:"#888",padding:"6px 11px",cursor:"pointer",fontSize:"0.52rem",fontFamily:"monospace",letterSpacing:"0.05em"}}>{s}s</button>)}
        </div>
      )}
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState("today");
  const[log,setLog]=useState(emptyLog());
  const[swLog,setSWLog]=useState(emptySW());
  const[meta,setMeta]=useState(emptyMeta());
  const[weights,setWeights]=useState([]);
  const[swHist,setSWHist]=useState({});
  const[prs,setPRs]=useState({pullups:[],pushups:[],press:[],squat:[]});
  const[meas,setMeas]=useState([]);
  const[cyber,setCyber]=useState({rooms:0,writeups:0,tools:{linux:false,nmap:false,burp:false,wireshark:false,metasploit:false,sqlmap:false,gobuster:false,john:false}});
  const[grocery,setGrocery]=useState({oats:false,pb:false,dates:false,eggs:false,milk:false,bananas:false});
  const[prIn,setPRIn]=useState({pullups:"",pushups:"",press:"",squat:""});
  const[measIn,setMeasIn]=useState({bicep:"",chest:"",waist:"",shoulder:""});
  const[saved,setSaved]=useState(false);

  const T=todayStr(),dn=Math.max(1,getDN(T)),ph=getPhase(dn),wt=WK_SCHED[getDOW(T)],wo=WO[wt];

  useEffect(()=>{
    const l=ls.get(`gw_log_${T}`);if(l)setLog({...emptyLog(),...l,sets:{...(l.sets||{})}});
    const sw=ls.get(`gw_sw_${T}`);if(sw)setSWLog({...emptySW(),...sw});
    const m=ls.get("gw_meta");if(m)setMeta({...emptyMeta(),...m,fails:{...emptyMeta().fails,...(m.fails||{})}});
    const w=ls.get("gw_wts");if(w)setWeights(w);
    const cy=ls.get("gw_cyber");if(cy)setCyber(p=>({...p,...cy,tools:{...p.tools,...(cy.tools||{})}}));
    const gr=ls.get("gw_grocery");if(gr)setGrocery(p=>({...p,...gr}));
    const pr=ls.get("gw_prs");if(pr)setPRs(p=>({...p,...pr}));
    const ms=ls.get("gw_meas");if(ms)setMeas(ms);
    const hist={};
    for(let i=0;i<35;i++){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split("T")[0];const e=ls.get(`gw_sw_${ds}`);if(e)hist[ds]=Object.values(e).filter(Boolean).length;}
    setSWHist(hist);
  },[]);

  const flash=()=>{setSaved(true);setTimeout(()=>setSaved(false),1200)};
  const upd=patch=>{const n={...log,...patch,sets:{...(log.sets||{}),...(patch.sets||{})}};setLog(n);ls.set(`gw_log_${T}`,n);flash()};

  const toggleSW=k=>{
    const next={...swLog,[k]:!swLog[k]};
    setSWLog(next);ls.set(`gw_sw_${T}`,next);
    const allDone=SW_KEYS.every(key=>next[key]);
    setMeta(m=>{
      const nm={...m,fails:{...(m.fails||{})}};
      if(!next[k])nm.fails[k]=(nm.fails[k]||0)+1;
      if(allDone){
        if(m.lastDate===prevDay(T)){nm.streak=(m.streak||0)+1;}
        else if(m.lastDate!==T){nm.streak=1;}
        nm.longest=Math.max(nm.longest||0,nm.streak);
        nm.lastDate=T;
      }
      ls.set("gw_meta",nm);return nm;
    });
    setSWHist(h=>({...h,[T]:SW_KEYS.filter(key=>next[key]).length}));
  };

  const saveWeight=()=>{if(!log.weight)return;const e={date:T,weight:parseFloat(log.weight)};const nw=[...weights.filter(w=>w.date!==T),e].sort((a,b)=>a.date.localeCompare(b.date));setWeights(nw);ls.set("gw_wts",nw);flash()};
  const savePR=id=>{if(!prIn[id])return;const e={date:T,v:parseFloat(prIn[id])};const np={...prs,[id]:[...prs[id].filter(p=>p.date!==T),e].sort((a,b)=>a.date.localeCompare(b.date))};setPRs(np);ls.set("gw_prs",np);setPRIn(p=>({...p,[id]:""}));flash()};
  const saveMeas=()=>{const e={date:T,...Object.fromEntries(Object.entries(measIn).filter(([,v])=>v).map(([k,v])=>[k,parseFloat(v)]))};if(Object.keys(e).length<=1)return;const nm=[...meas.filter(m=>m.date!==T),e].sort((a,b)=>a.date.localeCompare(b.date));setMeas(nm);ls.set("gw_meas",nm);setMeasIn({bicep:"",chest:"",waist:"",shoulder:""});flash()};

  const curW=weights.length?weights[weights.length-1].weight:SW_KG;
  const calEaten=log.meals.reduce((s,d,i)=>s+(d?MEALS[i].cal:0),0);
  const calTgt=BASE_CAL+(log.football?600:0);
  const swDone=SW_KEYS.filter(k=>swLog[k]).length;
  const allSW=swDone===SW_KEYS.length;
  const starkDone=SW_PILLARS.filter(p=>p.side==="STARK").flatMap(p=>p.tasks).filter(t=>swLog[t.k]).length;
  const wayneDone=SW_PILLARS.filter(p=>p.side==="WAYNE").flatMap(p=>p.tasks).filter(t=>swLog[t.k]).length;
  const starkTot=SW_PILLARS.filter(p=>p.side==="STARK").flatMap(p=>p.tasks).length;
  const wayneTot=SW_PILLARS.filter(p=>p.side==="WAYNE").flatMap(p=>p.tasks).length;
  const bestPR=id=>{const a=prs[id]||[];return a.length?a[a.length-1].v:null};
  const prevBestPR=id=>{const a=prs[id]||[];return a.length>1?a[a.length-2].v:null};
  const hrs=(()=>{if(!log.sleepAt||!log.wakeAt)return null;const[sh,sm]=log.sleepAt.split(":").map(Number),[wh,wm]=log.wakeAt.split(":").map(Number);let h=(wh*60+wm)-(sh*60+sm);if(h<0)h+=1440;return(h/60).toFixed(1)})();
  const hcol=!hrs?"#444":parseFloat(hrs)>=8?"#22c55e":parseFloat(hrs)>=6?"#eab308":"#ef4444";
  const weakest=(()=>{const fc=meta.fails||{};const top=Object.entries(fc).sort((a,b)=>b[1]-a[1])[0];if(!top||top[1]===0)return null;const t=SW_PILLARS.flatMap(p=>p.tasks).find(t=>t.k===top[0]);return t?{...t,count:top[1]}:null})();

  // STYLE HELPERS
  const B="#111",D="#080808",BRD="1px solid #1c1c1c";
  const C=(on,hc="#22c55e")=>({background:on?`${hc}12`:B,border:`1px solid ${on?`${hc}28`:BRD.split(" ")[2]}`,borderRadius:8,padding:"11px 13px",marginBottom:8,cursor:"pointer",transition:"all 0.2s"});
  const DOT=(on,col="#22c55e")=>({width:20,height:20,borderRadius:"50%",border:`2px solid ${on?col:"#2a2a2a"}`,background:on?col:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.5rem",color:"#fff",flexShrink:0,marginTop:2});
  const INP={background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:6,color:"#e2e2e2",padding:"8px 11px",fontFamily:"'Courier New',monospace",fontSize:"0.75rem",outline:"none",width:"100%",boxSizing:"border-box"};
  const BTN=(bg="#ef4444",extra={})=>({background:bg,border:"none",borderRadius:6,color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:"0.52rem",letterSpacing:"0.15em",fontFamily:"'Courier New',monospace",fontWeight:700,flexShrink:0,...extra});
  const TOG=(on,col="#22c55e")=>({width:42,height:22,borderRadius:11,background:on?col:"#2a2a2a",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0});
  const TOGD=(on)=>({width:18,height:18,borderRadius:"50%",background:"#fff",position:"absolute",top:2,left:on?22:2,transition:"left 0.2s"});
  const SB=(on,col)=>({width:31,height:31,borderRadius:6,cursor:"pointer",background:on?col:"#1a1a1a",border:`1px solid ${on?col:"#2a2a2a"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.55rem",color:on?"#fff":"#3a3a3a",transition:"all 0.15s",fontFamily:"monospace"});
  const LBL={fontSize:"0.5rem",letterSpacing:"0.25em",color:"#3a3a3a",marginBottom:9};
  const SEC={padding:"14px 18px 0"};

  return(
    <div style={{background:D,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:90}}>

      {/* HEADER */}
      <div style={{background:"#0c0c0c",borderBottom:BRD,padding:"13px 18px 10px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:"0.47rem",letterSpacing:"0.35em",color:"#ef4444",fontWeight:700,marginBottom:2}}>▶ BLOODHOUNDS MODE</div>
            <div style={{fontSize:"1rem",fontWeight:700,color:"#fff",letterSpacing:"0.08em"}}>GUN-WOO PROTOCOL</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:"0.47rem",color:ph.col,letterSpacing:"0.15em"}}>PHASE {ph.n} · {ph.name.toUpperCase()}</div>
            <div style={{fontSize:"0.75rem",color:"#fff",fontWeight:700}}>DAY {dn}</div>
            {saved&&<div style={{fontSize:"0.47rem",color:"#22c55e"}}>✓ SAVED</div>}
          </div>
        </div>
        <div style={{marginTop:9}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.5rem",color:"#3a3a3a",marginBottom:3}}>
            <span>{curW}kg now</span>
            <span>+{(curW-SW_KG).toFixed(1)}kg · {(TGT_KG-curW).toFixed(1)}kg left</span>
            <span style={{color:"#ef4444"}}>78kg target</span>
          </div>
          <div style={{background:"#1a1a1a",borderRadius:2,height:3,overflow:"hidden"}}>
            <div style={{width:`${Math.min(100,Math.max(0,((curW-SW_KG)/(TGT_KG-SW_KG))*100))}%`,height:"100%",background:"linear-gradient(90deg,#ef4444,#f97316)",transition:"width 0.5s"}}/>
          </div>
        </div>
      </div>

      {/* NAV */}
      <div style={{display:"flex",background:"#0c0c0c",borderBottom:BRD,position:"sticky",top:0,zIndex:10}}>
        {[["today","TODAY"],["train","TRAIN"],["progress","STATS"],["sw","S·W"],["plan","PLAN"]].map(([id,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 2px",background:"none",border:"none",borderBottom:tab===id?"2px solid #ef4444":"2px solid transparent",color:tab===id?"#fff":"#3a3a3a",fontSize:"0.48rem",letterSpacing:"0.12em",cursor:"pointer",fontFamily:"'Courier New',monospace",fontWeight:tab===id?700:400,transition:"all 0.15s"}}>{lb}</button>
        ))}
      </div>

      {/* ═══════ TODAY ═══════ */}
      {tab==="today"&&<div style={SEC}>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:"0.53rem",color:"#3a3a3a",marginBottom:4}}>{fmtDate(T).toUpperCase()}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <div style={{background:`${wo.col}18`,border:`1px solid ${wo.col}30`,borderRadius:4,padding:"3px 9px",fontSize:"0.53rem",color:wo.col,fontWeight:700}}>{wo.tag}</div>
            <div style={{background:`${allSW?"#22c55e":"#ef4444"}18`,border:`1px solid ${allSW?"#22c55e":"#ef4444"}30`,borderRadius:4,padding:"3px 9px",fontSize:"0.53rem",color:allSW?"#22c55e":"#888"}}>S·W {swDone}/8</div>
            {hrs&&<div style={{background:`${hcol}15`,border:`1px solid ${hcol}30`,borderRadius:4,padding:"3px 9px",fontSize:"0.53rem",color:hcol}}>{hrs}h sleep</div>}
          </div>
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"10px 13px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><div style={{fontSize:"0.62rem"}}>⚽ Football Today?</div><div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:2}}>+600 cal target added</div></div>
          <div style={TOG(log.football)} onClick={()=>upd({football:!log.football})}><div style={TOGD(log.football)}/></div>
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"10px 13px",marginBottom:10}}>
          <div style={{fontSize:"0.48rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:5}}>CALORIES TODAY</div>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:5}}>
            <span style={{fontSize:"1.5rem",fontWeight:700,color:calEaten>=calTgt*.75?"#22c55e":"#ef4444"}}>{calEaten.toLocaleString()}</span>
            <span style={{fontSize:"0.6rem",color:"#3a3a3a"}}>/ {calTgt.toLocaleString()} kcal</span>
            <span style={{fontSize:"0.5rem",color:"#60a5fa",marginLeft:"auto"}}>{MEALS.reduce((s,m,i)=>s+(log.meals[i]?m.pro:0),0)}g pro</span>
          </div>
          <div style={{background:"#1a1a1a",borderRadius:2,height:3,overflow:"hidden"}}>
            <div style={{width:`${Math.min(100,(calEaten/calTgt)*100)}%`,height:"100%",background:"#22c55e",transition:"width 0.3s"}}/>
          </div>
          <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:4}}>{log.meals.filter(Boolean).length}/5 meals done · target {BASE_PRO}g protein</div>
        </div>

        <div style={LBL}>MEALS — TAP TO MARK EATEN</div>
        {MEALS.map((meal,i)=>(
          <div key={meal.id} style={C(log.meals[i])} onClick={()=>{const m=[...log.meals];m[i]=!m[i];upd({meals:m})}}>
            <div style={{display:"flex",gap:11,alignItems:"flex-start"}}>
              <div style={DOT(log.meals[i])}>{log.meals[i]?"✓":""}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:"0.68rem",fontWeight:700,color:log.meals[i]?"#22c55e":"#e2e2e2"}}>{meal.e} {meal.name}</span>
                  <span style={{fontSize:"0.5rem",color:"#3a3a3a"}}>{meal.time}</span>
                </div>
                <div style={{fontSize:"0.52rem",color:"#3a3a3a",marginTop:3,lineHeight:1.7}}>{meal.items.join(" · ")}</div>
                <div style={{display:"flex",gap:12,marginTop:5}}>
                  <span style={{fontSize:"0.5rem",color:"#f97316"}}>{meal.cal} kcal</span>
                  <span style={{fontSize:"0.5rem",color:"#60a5fa"}}>{meal.pro}g protein</span>
                </div>
              </div>
            </div>
          </div>
        ))}

        <div style={{background:B,border:BRD,borderRadius:8,padding:"10px 13px",margin:"5px 0 10px"}}>
          <div style={{fontSize:"0.48rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:8}}>💧 WATER — {log.water}/8 GLASSES</div>
          <div style={{display:"flex",gap:5}}>
            {Array.from({length:8},(_,i)=>(
              <div key={i} onClick={()=>upd({water:log.water===i+1?i:i+1})}
                style={{flex:1,height:26,borderRadius:4,cursor:"pointer",background:i<log.water?"#1d4ed8":"#1a1a1a",border:`1px solid ${i<log.water?"#3b82f6":"#2a2a2a"}`,transition:"all 0.15s"}}/>
            ))}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:10}}>
          {[["sleepAt","😴 SLEPT AT"],["wakeAt","⏰ WOKE AT"]].map(([k,lb])=>(
            <div key={k} style={{background:B,border:BRD,borderRadius:8,padding:"10px 11px"}}>
              <div style={{fontSize:"0.48rem",color:"#3a3a3a",marginBottom:5}}>{lb}</div>
              <input type="time" value={log[k]} onChange={e=>upd({[k]:e.target.value})}
                style={{background:"transparent",border:"none",color:"#e2e2e2",fontFamily:"'Courier New',monospace",fontSize:"0.8rem",outline:"none",width:"100%"}}/>
            </div>
          ))}
        </div>
        {hrs&&<div style={{background:`${hcol}10`,border:`1px solid ${hcol}25`,borderRadius:8,padding:"8px 13px",marginBottom:10,display:"flex",justifyContent:"space-between"}}>
          <span style={{fontSize:"0.6rem",color:hcol}}>{hrs} hrs sleep</span>
          <span style={{fontSize:"0.55rem",color:hcol}}>{parseFloat(hrs)>=8?"Optimal 🟢":parseFloat(hrs)>=6?"Acceptable 🟡":"Insufficient 🔴"}</span>
        </div>}

        <div style={{...C(log.wDone),display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}
          onClick={()=>upd({wDone:!log.wDone})}>
          <div>
            <div style={{fontSize:"0.66rem",color:log.wDone?"#22c55e":"#e2e2e2",fontWeight:700}}>
              {wt==="REST"?"🛌 Rest Day":wt==="BOXING"?"🥊 Boxing Done":`💪 ${wo.name} Done`}
            </div>
            <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:2}}>Tap to mark complete</div>
          </div>
          <div style={{fontSize:"1.2rem"}}>{log.wDone?"✅":"⬜"}</div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:10}}>
          <div style={{background:B,border:BRD,borderRadius:8,padding:"10px 11px"}}>
            <div style={{fontSize:"0.48rem",color:"#3a3a3a",marginBottom:6}}>⚖️ WEIGHT (KG)</div>
            <div style={{display:"flex",gap:6}}>
              <input type="number" step="0.1" placeholder={`${curW}`} value={log.weight} onChange={e=>upd({weight:e.target.value})} style={{...INP,flex:1,padding:"5px 8px",fontSize:"0.75rem"}}/>
              <button onClick={saveWeight} style={BTN("#ef4444",{padding:"6px 10px",fontSize:"0.48rem"})}>OK</button>
            </div>
          </div>
          <div style={{background:B,border:BRD,borderRadius:8,padding:"10px 11px"}}>
            <div style={{fontSize:"0.48rem",color:"#3a3a3a",marginBottom:6}}>📝 TODAY'S NOTE</div>
            <input type="text" placeholder="one line..." value={log.note} onChange={e=>upd({note:e.target.value})} style={{...INP,padding:"5px 8px",fontSize:"0.7rem"}}/>
          </div>
        </div>

        <div style={{background:"#0e0e0e",border:`1px solid ${allSW?"#22c55e30":"#1c1c1c"}`,borderRadius:8,padding:"10px 13px",marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:"0.6rem",color:allSW?"#22c55e":"#e2e2e2",fontWeight:700}}>STARK·WAYNE {swDone}/8</div>
            <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:2}}>{allSW?`Perfect day · streak: ${meta.streak}`:"Go to S·W tab to complete tasks"}</div>
          </div>
          <button onClick={()=>setTab("sw")} style={BTN("#1a1a1a",{border:"1px solid #2a2a2a",color:"#888",fontSize:"0.48rem"})}>OPEN →</button>
        </div>
      </div>}

      {/* ═══════ TRAIN ═══════ */}
      {tab==="train"&&<div style={SEC}>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:"0.47rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:3}}>TODAY'S SESSION</div>
          <div style={{fontSize:"1.05rem",fontWeight:700,color:wo.col,letterSpacing:"0.06em"}}>{wo.name.toUpperCase()}</div>
          <div style={{fontSize:"0.55rem",color:"#3a3a3a",marginTop:2}}>{fmtDate(T)}</div>
        </div>

        {wt==="REST"?(
          <div style={{background:B,border:BRD,borderRadius:8,padding:28,textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:"2.5rem",marginBottom:10}}>😴</div>
            <div style={{color:"#3a3a3a",fontSize:"0.63rem",lineHeight:2}}>REST DAY<br/>Eat all 5 meals.<br/>Sleep by 10:30 PM.<br/>Recovery is part of the protocol.</div>
          </div>
        ):(
          <>
            {wo.ex.map(ex=>{
              const sets=log.sets||{};
              const done=Array.from({length:ex.s},(_,i)=>sets[`${ex.k}_${i}`]).filter(Boolean).length;
              const all=done===ex.s;
              return(
                <div key={ex.k} style={{background:all?"#0d1f0d":B,border:`1px solid ${all?"#22c55e25":"#1c1c1c"}`,borderRadius:8,padding:"11px 13px",marginBottom:9,animation:"fadeIn 0.2s ease"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
                    <div>
                      <div style={{fontSize:"0.7rem",fontWeight:700,color:all?"#22c55e":"#e2e2e2"}}>{ex.n}</div>
                      <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:2}}>{ex.s} sets × {ex.r}</div>
                      <div style={{fontSize:"0.48rem",color:"#2a2a2a",marginTop:1}}>{ex.note}</div>
                    </div>
                    <div style={{fontSize:"0.62rem",color:all?"#22c55e":"#555",fontWeight:700}}>{done}/{ex.s}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {Array.from({length:ex.s},(_,i)=>{
                      const sd=(log.sets||{})[`${ex.k}_${i}`];
                      return<div key={i} style={SB(sd,wo.col)} onClick={()=>{const ns={...(log.sets||{}),[`${ex.k}_${i}`]:!sd};upd({sets:ns})}}>{sd?"✓":i+1}</div>;
                    })}
                  </div>
                </div>
              );
            })}
            <RestTimer/>
            <div style={{background:"#0a0a0a",border:BRD,borderRadius:8,padding:"10px 13px",marginBottom:12}}>
              <div style={{fontSize:"0.47rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:4}}>PROTOCOL</div>
              <div style={{fontSize:"0.57rem",color:"#333",lineHeight:1.85}}>60–90 sec rest · Water between exercises · Add weight when last set feels easy · Film one set for form check</div>
            </div>
          </>
        )}

        <div style={LBL}>LOG TODAY'S PRs</div>
        {[{id:"pullups",l:"Pull-ups",u:"reps"},{id:"pushups",l:"Push-ups",u:"reps"},{id:"press",l:"Shoulder Press",u:"kg"},{id:"squat",l:"Goblet Squat",u:"kg"}].map(p=>{
          const best=bestPR(p.id),prev=prevBestPR(p.id);
          return(
            <div key={p.id} style={{background:B,border:BRD,borderRadius:8,padding:"10px 13px",marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:"0.62rem",color:"#e2e2e2"}}>{p.l}</span>
                <div style={{textAlign:"right"}}>
                  {best!==null&&<span style={{fontSize:"0.6rem",color:"#eab308",fontWeight:700}}>BEST: {best} {p.u}</span>}
                  {best!==null&&prev!==null&&best>prev&&<span style={{fontSize:"0.48rem",color:"#22c55e",marginLeft:8}}>▲ PR +{(best-prev).toFixed(1)}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <input type="number" step="0.5" placeholder="today's best" value={prIn[p.id]} onChange={e=>setPRIn(pv=>({...pv,[p.id]:e.target.value}))} style={{...INP,flex:1}}/>
                <button onClick={()=>savePR(p.id)} style={BTN()}>LOG</button>
              </div>
            </div>
          );
        })}
        <div style={{height:10}}/>
      </div>}

      {/* ═══════ STATS ═══════ */}
      {tab==="progress"&&<div style={SEC}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9,marginBottom:14}}>
          {[{l:"CURRENT",v:`${curW}kg`,c:"#e2e2e2"},{l:"GAINED",v:`+${(curW-SW_KG).toFixed(1)}kg`,c:"#22c55e"},{l:"TO GO",v:`${(TGT_KG-curW).toFixed(1)}kg`,c:"#ef4444"}].map(s=>(
            <div key={s.l} style={{background:B,border:BRD,borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:"0.45rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:3}}>{s.l}</div>
              <div style={{fontSize:"0.92rem",fontWeight:700,color:s.c}}>{s.v}</div>
            </div>
          ))}
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 11px",marginBottom:13}}>
          <div style={LBL}>WEIGHT JOURNEY → 78KG</div>
          <WtChart weights={weights}/>
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>CONSISTENCY HEATMAP — LAST 35 DAYS</div>
          <Heatmap scores={swHist}/>
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>PHASE TIMELINE</div>
          {[{n:1,name:"Foundation",days:"Day 1–61",tgt:"67–68kg",col:"#ef4444",s:1},{n:2,name:"Build",days:"Day 62–152",tgt:"73–74kg",col:"#f97316",s:62},{n:3,name:"Sharpen",days:"Day 153–365",tgt:"78–80kg",col:"#eab308",s:153}].map(p=>(
            <div key={p.n} style={{display:"flex",gap:10,marginBottom:9}}>
              <div style={{width:4,borderRadius:2,background:dn>=p.s?p.col:"#222",flexShrink:0,alignSelf:"stretch",minHeight:30}}/>
              <div>
                <div style={{fontSize:"0.62rem",fontWeight:ph.n===p.n?700:400,color:ph.n===p.n?p.col:"#3a3a3a"}}>Phase {p.n}: {p.name}{ph.n===p.n?" ← YOU ARE HERE":""}</div>
                <div style={{fontSize:"0.5rem",color:"#2a2a2a",marginTop:2}}>{p.days} · Target {p.tgt}</div>
              </div>
            </div>
          ))}
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>6-MONTH MILESTONES</div>
          {[{mo:"Month 1",kg:66,c:"Sleep fixed. 3+ meals daily. Every session done."},{mo:"Month 2",kg:68,c:"Visible shoulder change. Pull-ups 12+."},{mo:"Month 3",kg:70,c:"Weighted pull-ups started. V-taper forming."},{mo:"Month 4",kg:71,c:"People notice. DB shoulder press 15kg+."},{mo:"Month 5",kg:73,c:"You look like you train. Boxing combos clean."},{mo:"Month 6",kg:75,c:"Visible definition. Foundation complete."}].map(m=>{
            const r=curW>=m.kg-.5;
            return(<div key={m.mo} style={{display:"flex",gap:9,marginBottom:8}}>
              <span style={{fontSize:"0.7rem"}}>{r?"✅":"⬜"}</span>
              <div><div style={{fontSize:"0.6rem",color:r?"#22c55e":"#e2e2e2",fontWeight:r?700:400}}>{m.mo} — {m.kg}kg</div>
              <div style={{fontSize:"0.5rem",color:"#2a2a2a",marginTop:2}}>{m.c}</div></div>
            </div>);
          })}
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>PERSONAL RECORDS</div>
          {[{id:"pullups",l:"Pull-ups",u:"reps"},{id:"pushups",l:"Push-ups",u:"reps"},{id:"press",l:"Shoulder Press",u:"kg"},{id:"squat",l:"Goblet Squat",u:"kg"}].map(p=>{
            const best=bestPR(p.id),prev=prevBestPR(p.id);
            return(<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #191919"}}>
              <span style={{fontSize:"0.62rem"}}>{p.l}</span>
              <div style={{textAlign:"right"}}>
                {best!==null?<><span style={{fontSize:"0.72rem",fontWeight:700,color:"#eab308"}}>{best} {p.u}</span>
                  {prev!==null&&best>prev&&<span style={{display:"block",fontSize:"0.45rem",color:"#22c55e"}}>▲ +{(best-prev).toFixed(1)} new PR</span>}</>
                :<span style={{fontSize:"0.55rem",color:"#333"}}>not logged</span>}
              </div>
            </div>);
          })}
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:20}}>
          <div style={LBL}>BODY MEASUREMENTS (CM)</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            {[["bicep","💪 Bicep"],["chest","🫁 Chest"],["waist","〰️ Waist"],["shoulder","↔️ Shoulders"]].map(([k,lb])=>(
              <div key={k}>
                <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginBottom:4}}>
                  {lb}
                  {meas.length>0&&meas[meas.length-1][k]&&<span style={{color:"#f97316",marginLeft:6}}>{meas[meas.length-1][k]}cm</span>}
                </div>
                <input type="number" step="0.5" placeholder="enter cm" value={measIn[k]} onChange={e=>setMeasIn(p=>({...p,[k]:e.target.value}))}
                  style={{...INP,padding:"6px 9px",fontSize:"0.72rem"}}/>
              </div>
            ))}
          </div>
          <button onClick={saveMeas} style={{...BTN(),width:"100%",padding:"9px",fontSize:"0.55rem",letterSpacing:"0.2em"}}>SAVE MEASUREMENTS</button>
          {meas.length>0&&<div style={{marginTop:10,fontSize:"0.5rem",color:"#3a3a3a"}}>Last saved: {meas[meas.length-1].date}</div>}
        </div>
      </div>}

      {/* ═══════ STARK·WAYNE ═══════ */}
      {tab==="sw"&&<div style={SEC}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:"0.47rem",letterSpacing:"0.35em",color:"#3a3a3a",marginBottom:5}}>IDENTITY PROTOCOL</div>
          <div style={{fontSize:"1.05rem",fontWeight:700,letterSpacing:"0.14em"}}>
            <span style={{color:"#f59e0b"}}>STARK</span><span style={{color:"#333",margin:"0 10px"}}>·</span><span style={{color:"#ef4444"}}>WAYNE</span>
          </div>
          <div style={{fontSize:"0.5rem",color:"#2a2a2a",marginTop:5,letterSpacing:"0.1em"}}>8 TASKS · ALL OR NOTHING · NO PARTIAL CREDIT</div>
        </div>

        <div style={{background:"#0e0e0e",border:`1px solid ${allSW?"#22c55e35":"#1c1c1c"}`,borderRadius:12,padding:"18px 16px 14px",marginBottom:13,display:"flex",flexDirection:"column",alignItems:"center",transition:"border-color 0.5s"}}>
          <Ring pct={(swDone/SW_KEYS.length)*100}/>
          <div style={{marginTop:10,textAlign:"center"}}>
            <div style={{fontSize:"0.62rem",color:allSW?"#22c55e":"#e2e2e2",fontWeight:700,letterSpacing:"0.1em"}}>{allSW?"✦  PERFECT DAY  ✦":`${swDone} / ${SW_KEYS.length} TASKS COMPLETE`}</div>
            {allSW&&<div style={{fontSize:"0.5rem",color:"#22c55e50",marginTop:3,letterSpacing:"0.2em"}}>STREAK BUILDING · {meta.streak} DAYS</div>}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          <div style={{background:B,border:BRD,borderRadius:8,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:"0.47rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:4}}>🔥 STREAK</div>
            <div style={{fontSize:"1.7rem",fontWeight:700,color:meta.streak>0?"#f97316":"#2a2a2a",lineHeight:1}}>{meta.streak||0}</div>
            <div style={{fontSize:"0.47rem",color:"#2a2a2a",marginTop:3}}>consecutive days</div>
          </div>
          <div style={{background:B,border:BRD,borderRadius:8,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:"0.47rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:4}}>⚡ LONGEST</div>
            <div style={{fontSize:"1.7rem",fontWeight:700,color:meta.longest>0?"#eab308":"#2a2a2a",lineHeight:1}}>{meta.longest||0}</div>
            <div style={{fontSize:"0.47rem",color:"#2a2a2a",marginTop:3}}>personal best</div>
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          {[{lbl:"STARK",side:"Mind + Craft",done:starkDone,tot:starkTot,col:"#f59e0b",icon:"⚙️"},{lbl:"WAYNE",side:"Body + Identity",done:wayneDone,tot:wayneTot,col:"#ef4444",icon:"⚔️"}].map(p=>(
            <div key={p.lbl} style={{background:B,border:`1px solid ${p.col}20`,borderRadius:8,padding:"12px"}}>
              <div style={{fontSize:"0.5rem",color:p.col,letterSpacing:"0.2em",fontWeight:700,marginBottom:7}}>{p.icon} {p.lbl}</div>
              <div style={{fontSize:"1.3rem",fontWeight:700,color:p.col,marginBottom:5}}>{p.done}<span style={{fontSize:"0.68rem",color:"#3a3a3a"}}>/{p.tot}</span></div>
              <div style={{background:"#1a1a1a",borderRadius:2,height:3,overflow:"hidden",marginBottom:5}}>
                <div style={{width:`${(p.done/p.tot)*100}%`,height:"100%",background:p.done===p.tot?"#22c55e":p.col,transition:"width 0.4s"}}/>
              </div>
              <div style={{fontSize:"0.47rem",color:"#2a2a2a"}}>{p.side}</div>
            </div>
          ))}
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>CONSISTENCY — LAST 35 DAYS</div>
          <Heatmap scores={swHist}/>
        </div>

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={LBL}>PILLAR BREAKDOWN</div>
          {SW_PILLARS.map(p=>{
            const done=p.tasks.filter(t=>swLog[t.k]).length,pct=(done/p.tasks.length)*100;
            return(<div key={p.id} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:"0.57rem",color:p.col,fontWeight:700}}>{p.icon} {p.label} <span style={{color:"#3a3a3a",fontWeight:400,fontSize:"0.47rem"}}>{p.side}</span></span>
                <span style={{fontSize:"0.57rem",color:done===p.tasks.length?"#22c55e":"#555"}}>{done}/{p.tasks.length}</span>
              </div>
              <div style={{background:"#1a1a1a",borderRadius:2,height:3,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:done===p.tasks.length?"#22c55e":p.col,transition:"width 0.4s"}}/>
              </div>
            </div>);
          })}
        </div>

        <div style={LBL}>TODAY'S 8 TASKS</div>
        {SW_PILLARS.map(pillar=>(
          <div key={pillar.id} style={{marginBottom:13}}>
            <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:"0.68rem"}}>{pillar.icon}</span>
              <span style={{fontSize:"0.55rem",color:pillar.col,letterSpacing:"0.15em",fontWeight:700}}>{pillar.label}</span>
              <span style={{fontSize:"0.47rem",color:"#333"}}>{pillar.side}</span>
            </div>
            {pillar.tasks.map(task=>(
              <div key={task.k} style={{...C(swLog[task.k],pillar.col),display:"flex",gap:11}} onClick={()=>toggleSW(task.k)}>
                <div style={DOT(swLog[task.k],pillar.col)}>{swLog[task.k]?"✓":""}</div>
                <div>
                  <div style={{fontSize:"0.66rem",fontWeight:700,color:swLog[task.k]?"#22c55e":"#e2e2e2"}}>{task.l}</div>
                  <div style={{fontSize:"0.5rem",color:"#3a3a3a",marginTop:3,lineHeight:1.65}}>{task.s}</div>
                </div>
              </div>
            ))}
          </div>
        ))}

        <div style={{background:"#0e0e0e",border:`1px solid ${weakest?"#ef444428":"#1c1c1c"}`,borderRadius:8,padding:"12px 13px",marginBottom:13}}>
          <div style={{fontSize:"0.47rem",color:"#3a3a3a",letterSpacing:"0.2em",marginBottom:8}}>🎯 WEAKNESS DETECTOR</div>
          {weakest?(<>
            <div style={{fontSize:"0.55rem",color:"#ef4444",marginBottom:3}}>Most skipped task:</div>
            <div style={{fontSize:"0.72rem",fontWeight:700,marginBottom:4}}>{weakest.l}</div>
            <div style={{fontSize:"0.5rem",color:"#555",lineHeight:1.7}}>Skipped {weakest.count} time{weakest.count>1?"s":""}. This is where your discipline breaks. Watch it.</div>
          </>):(
            <div style={{fontSize:"0.57rem",color:"#2a2a2a",lineHeight:1.7}}>Start completing and unchecking tasks — this tracks your patterns.</div>
          )}
        </div>

        <div style={{background:"#09090a",border:"1px solid #1f1a0d",borderRadius:8,padding:"13px",marginBottom:20}}>
          <div style={{fontSize:"0.47rem",color:"#f59e0b40",letterSpacing:"0.25em",marginBottom:8}}>THE CHALLENGE</div>
          <div style={{fontSize:"0.6rem",color:"#4a4030",lineHeight:1.9,fontStyle:"italic",borderLeft:"2px solid #f59e0b25",paddingLeft:12}}>
            "Which of these will you cheat on first?<br/>That's the one to watch."
          </div>
          <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #1a1505",fontSize:"0.5rem",color:"#3a3025",lineHeight:1.9}}>
            8 tasks. Specific. Binary. No vague wins.<br/>You either did it or you didn't. Every single day.
          </div>
        </div>
      </div>}

      {/* ═══════ PLAN ═══════ */}
      {tab==="plan"&&<div style={SEC}>

        <div style={{background:"#0d1a0d",border:"1px solid #22c55e25",borderRadius:8,padding:"12px 13px",marginBottom:14}}>
          <div style={LBL}>🛒 WEEKLY GROCERY CHECKLIST</div>
          {[["oats","🥣 Oats (1kg — ₹80)","Buy weekly"],["pb","🥜 Peanut Butter (jar — ₹180)","Lasts 2-3 weeks"],["dates","🌴 Dates (250g — ₹100)","Buy weekly"],["eggs","🥚 Eggs (12 pack)","Buy twice a week"],["milk","🥛 Full-fat Milk (2L)","Buy twice a week"],["bananas","🍌 Bananas (1 dozen)","Buy weekly"]].map(([k,lb,note])=>(
            <div key={k} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #1a1a1a"}}>
              <div>
                <div style={{fontSize:"0.62rem",color:grocery[k]?"#22c55e":"#e2e2e2",textDecoration:grocery[k]?"line-through":"none"}}>{lb}</div>
                <div style={{fontSize:"0.47rem",color:"#3a3a3a",marginTop:1}}>{note}</div>
              </div>
              <div style={TOG(grocery[k],"#22c55e")} onClick={()=>{const ng={...grocery,[k]:!grocery[k]};setGrocery(ng);ls.set("gw_grocery",ng);}}>
                <div style={TOGD(grocery[k])}/>
              </div>
            </div>
          ))}
        </div>

        <div style={{background:"#0a0d1a",border:"1px solid #3b82f625",borderRadius:8,padding:"12px 13px",marginBottom:14}}>
          <div style={LBL}>⚡ CYBERSECURITY TRACKER</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:12}}>
            {[["rooms","TryHackMe Rooms","🎯"],["writeups","Write-ups","📝"]].map(([k,lb,ic])=>(
              <div key={k} style={{background:"#111",border:"1px solid #1c1c1c",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:"0.5rem",color:"#3b82f6",letterSpacing:"0.08em",marginBottom:6}}>{ic} {lb}</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
                  <button onClick={()=>{const nc={...cyber,[k]:Math.max(0,cyber[k]-1)};setCyber(nc);ls.set("gw_cyber",nc)}} style={BTN("#1a1a1a",{border:"1px solid #2a2a2a",color:"#666",padding:"4px 10px",fontSize:"0.8rem"})}>−</button>
                  <span style={{fontSize:"1.5rem",fontWeight:700,color:"#3b82f6",minWidth:32,textAlign:"center"}}>{cyber[k]}</span>
                  <button onClick={()=>{const nc={...cyber,[k]:cyber[k]+1};setCyber(nc);ls.set("gw_cyber",nc)}} style={BTN("#3b82f6",{padding:"4px 10px",fontSize:"0.8rem"})}>+</button>
                </div>
              </div>
            ))}
          </div>
          <div style={{fontSize:"0.5rem",color:"#3b82f6",letterSpacing:"0.12em",marginBottom:8}}>TOOLS LEARNED</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {Object.entries(cyber.tools).map(([k,v])=>(
              <div key={k} onClick={()=>{const nc={...cyber,tools:{...cyber.tools,[k]:!v}};setCyber(nc);ls.set("gw_cyber",nc)}}
                style={{padding:"5px 10px",borderRadius:20,border:`1px solid ${v?"#22c55e50":"#2a2a2a"}`,background:v?"#22c55e15":"#1a1a1a",color:v?"#22c55e":"#3a3a3a",fontSize:"0.55rem",cursor:"pointer",transition:"all 0.2s",fontFamily:"monospace",letterSpacing:"0.05em"}}>
                {v?"✓ ":""}{k}
              </div>
            ))}
          </div>
          <div style={{marginTop:10,fontSize:"0.5rem",color:"#3a3a3a",lineHeight:1.9,paddingTop:9,borderTop:"1px solid #1a1a1a"}}>
            Phase 1: linux + nmap → Phase 2: burp + wireshark → Phase 3: metasploit + sqlmap + gobuster + john
          </div>
        </div>

        <div style={LBL}>DAILY MEAL PLAN — {BASE_CAL.toLocaleString()} KCAL BASE</div>
        {MEALS.map(m=>(
          <div key={m.id} style={{background:B,border:BRD,borderRadius:8,padding:"10px 13px",marginBottom:9}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:"0.68rem",fontWeight:700}}>{m.e} {m.name}</span>
              <span style={{fontSize:"0.53rem",color:"#3a3a3a"}}>{m.time}</span>
            </div>
            <div style={{fontSize:"0.53rem",color:"#3a3a3a",lineHeight:1.8}}>{m.items.join(" · ")}</div>
            <div style={{display:"flex",gap:13,marginTop:6,paddingTop:6,borderTop:"1px solid #191919"}}>
              <span style={{fontSize:"0.5rem",color:"#f97316"}}>🔥 {m.cal} kcal</span>
              <span style={{fontSize:"0.5rem",color:"#60a5fa"}}>💪 {m.pro}g protein</span>
            </div>
          </div>
        ))}
        <div style={{background:"#0a0a0a",border:BRD,borderRadius:6,padding:"9px 12px",marginBottom:14,fontSize:"0.53rem",color:"#3a3a3a",lineHeight:1.7}}>
          ⚽ Football days: extra cup rice at meals 2+4, extra glass milk = +600 cal target
        </div>

        <div style={LBL}>WEEKLY SCHEDULE</div>
        {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((day,i)=>{
          const w=WO[WK_SCHED[i]];
          return(<div key={day} style={{display:"flex",alignItems:"center",gap:9,marginBottom:7}}>
            <div style={{width:26,fontSize:"0.53rem",color:"#3a3a3a"}}>{day}</div>
            <div style={{flex:1,background:B,border:`1px solid ${w.col}18`,borderRadius:6,padding:"7px 11px",display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:"0.6rem",color:WK_SCHED[i]==="REST"?"#333":"#e2e2e2"}}>{w.name}</span>
              <span style={{fontSize:"0.5rem",color:w.col}}>{w.tag}</span>
            </div>
          </div>);
        })}

        <div style={{background:B,border:BRD,borderRadius:8,padding:"12px 13px",marginTop:10,marginBottom:14}}>
          <div style={LBL}>DUMBBELL LOADS (YOUR SETUP)</div>
          {[["Pull-ups","Bodyweight","Start weighted +5kg at Month 3"],["Shoulder Press","10kg each","DB Shoulder Press"],["Rows / Floor Press","12.5kg each","10kg + 2.5kg plate"],["Curls","7.5kg each","5kg + 2.5kg"],["Lateral Raises","5kg each","2×2.5kg"],["Goblet Squat","17–22kg","Stack all plates"],["Romanian Deadlift","Both DBs max","Progressive load"]].map(([e,w,note])=>(
            <div key={e} style={{padding:"6px 0",borderBottom:"1px solid #191919"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:"0.6rem"}}>{e}</span>
                <span style={{fontSize:"0.6rem",color:"#f97316",fontWeight:700}}>{w}</span>
              </div>
              <div style={{fontSize:"0.47rem",color:"#2a2a2a",marginTop:1}}>{note}</div>
            </div>
          ))}
        </div>

        <div style={{background:B,border:"1px solid #06b6d420",borderRadius:8,padding:"12px 13px",marginBottom:20}}>
          <div style={LBL}>BOXING PROGRESSION</div>
          {[{ph:"Phase 1 — Month 1-2",col:"#06b6d4",steps:["Stance, guard, footwork fundamentals","Jab + Cross — master these two first","4×2min shadowboxing rounds","Core finisher every session"]},{ph:"Phase 2 — Month 3-5",col:"#3b82f6",steps:["Add Hook + Uppercut","Full combos: jab-cross-hook, jab-cross-uppercut","5×2min rounds + bag work if available","Defensive movement: slipping, rolling"]},{ph:"Phase 3 — Month 6+",col:"#8b5cf6",steps:["Sparring ready — find a partner or class","Your conditioning base will make you instantly better than beginners","Jump rope daily — 10+ minutes, best conditioning tool (₹300)"]},{ph:"Non-negotiable daily",col:"#22c55e",steps:["Jump rope 5–10 min every boxing day","Shadowbox in front of a mirror when possible"]}].map(p=>(
            <div key={p.ph} style={{marginBottom:11}}>
              <div style={{fontSize:"0.6rem",color:p.col,fontWeight:700,marginBottom:5}}>{p.ph}</div>
              {p.steps.map(s=><div key={s} style={{fontSize:"0.52rem",color:"#3a3a3a",lineHeight:1.85,paddingLeft:10}}>· {s}</div>)}
            </div>
          ))}
        </div>
      </div>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
